#####################################################################
# 	Temperature Sensor Settings
#####################################################################

[heater_bed]
##	SSR Pin - In E1 OUT position
heater_pin: PC8
sensor_type: Generic 3950
sensor_pin: PC3
# Recommended max power is 0.4W / cm^2
# 30*30 * 0.4 = 360W
# Heater is 450W
# 450*0.8 = 360
max_power: 0.8
min_temp: 0
max_temp: 120
control: pid
pid_kp: 51.412
pid_ki: 1.349
pid_kd: 489.701

# [temperature_sensor chamber]
# sensor_type: Generic 3950
# sensor_pin: PC1
# min_temp: 0
# max_temp: 130

[temperature_sensor rpi]
sensor_type: temperature_host
min_temp: -40
max_temp: 85

# Toolhead board sensor next to TMC2209
[temperature_sensor toolhead_board]
sensor_type: Generic 3950
sensor_pin: toolhead_mcu:PA0
pullup_resistor: 2200
min_temp: 0
max_temp: 180

[temperature_sensor toolhead_mcu]
sensor_type: temperature_mcu
sensor_mcu: toolhead_mcu
min_temp: 0
max_temp: 150

[z_thermal_adjust]
temp_coeff: 0.0025
#   The temperature coefficient of expansion, in mm/degC. For example, a
#   temp_coeff of 0.01 mm/degC will move the Z axis downwards by 0.01 mm for
#   every degree Celsius that the temperature sensor increases. Defaults to
#   0.0 mm/degC, which applies no adjustment.
#smooth_time:
#   Smoothing window applied to the temperature sensor, in seconds. Can reduce
#   motor noise from excessive small corrections in response to sensor noise.
#   The default is 2.0 seconds.
#z_adjust_off_above:
#   Disables adjustments above this Z height [mm]. The last computed correction
#   will remain applied until the toolhead moves below the specified Z height
#   again. The default is 99999999.0 mm (always on).
#max_z_adjustment:
#   Maximum absolute adjustment that can be applied to the Z axis [mm]. The
#   default is 99999999.0 mm (unlimited).
sensor_type: PT1000
sensor_pin: PC2
min_temp: 0
max_temp: 100
#   Temperature sensor configuration.
#   See the "extruder" section for the definition of the above
#   parameters.


# Stepper body thermistor
# [temperature_sensor stepper_body]
# sensor_type: Generic 3950
# sensor_pin: PC5
# min_temp: 0
# max_temp: 200

# Top chamber thermistor - stealthmax exhaust
#[temperature_sensor chamber_top]
#sensor_type: ATC Semitec 104NT-4-R025H42G
#sensor_pin: PA7
#min_temp: 0
#max_temp: 100

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 150

# Combined chamber sensor
[temperature_sensor chamber]
sensor_type: temperature_combined
sensor_list: temperature_sensor toolhead_mcu, temperature_sensor toolhead_board, temperature_sensor cartographer
combination_method: mean
maximum_deviation: 999.9

