[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    TURN_OFF_HEATERS
    CLEAR_PAUSE
    M400                           ; wait for buffer to clear
    PARK_FILAMENT

    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 20.0) %}
        {% set z_safe = 20.0 %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}

    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0

    G91                 ; Relative Positioning
    G1 Z{z_safe} F900   ; Move up to a safe z
    G90                 ; Absolute Positioning
    G1 X150 Y305 F6000  ; Move to park position, back and center

    M107 ; Turn part fan off

    _ADD_PRINT_TIME
    SDCARD_RESET_FILE
    _SD_PRINTER_STATS
    AIR_FILTER_COOLDOWN
    BASE_CANCEL_PRINT

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < (max_z - 5.0) %}
        {% set z_safe = 5.0 %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}

    G92 E0
    G1 E-{params.E|default(1)} F1500.0

    G90 ; Absolute Positioning
    SAVE_GCODE_STATE NAME=PAUSE_state
    BASE_PAUSE
    G91 ; Relative Positioning
    G1 Z{z_safe} F900
    G90
    G1 X{params.X|default(150)} Y{params.Y|default(305)} F6000

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    
    G90 ; Absolute Positioning
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1
    BASE_RESUME

[gcode_macro M600]
gcode:
  SAVE_GCODE_STATE NAME=M600_state
  PAUSE
  
  RESTORE_GCODE_STATE NAME=M600_state

[gcode_macro M601]
gcode:
  SAVE_GCODE_STATE NAME=M601_state
  PAUSE
  
  RESTORE_GCODE_STATE NAME=M601_state