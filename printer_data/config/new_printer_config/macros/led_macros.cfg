#####################################################################
#   Custom LED control macros
#   Contains the below macros:
#   NOZZLE_LED_ON
#   NOZZLE_LED_OFF
#   LED_ON (controls all printer lighting)
#   LED_OFF (controls all printer lighting)
#####################################################################

[gcode_macro NOZZLE_LED_ON]
gcode:
    SET_NOZZLE_LEDS_ON

[gcode_macro NOZZLE_LED_OFF]
gcode:
    SET_NOZZLE_LEDS_OFF

[gcode_macro LIGHT_ON]
gcode:
	SET_LED LED=chamber_leds WHITE={params.W | default(1)}

[gcode_macro LIGHT_OFF]
gcode:
	SET_LED LED=chamber WHITE=0

[delayed_gcode _CLEAR_CHAMBER_LIGHTS]
gcode:
	LIGHT_OFF

[gcode_macro LED_ON]
gcode:
    SET_LED LED=chamber_leds RED=1 GREEN=0.85 BLUE=0.73
    #SET_LED LED=chamber_leds WHITE=1
    SET_NOZZLE_LEDS_ON

[gcode_macro LED_OFF]
gcode:
    SET_LED LED=chamber_leds RED=0 GREEN=0 BLUE=0 WHITE=0
    SET_NOZZLE_LEDS_OFF