[include sensorless.cfg]

# [autotune_tmc stepper_x]
# motor: ldo-42sth48-2504ah
# tuning_goal: performance
# sgt: 1
# PWM_FREQ_TARGET: 55e3
# extra_hysteresis: 1


# [autotune_tmc stepper_y]
# motor: ldo-42sth48-2504ah
# tuning_goal: performance
# sgt: 1
# PWM_FREQ_TARGET: 55e3
# extra_hysteresis: 1


# [autotune_tmc stepper_z]
# motor: moons-ms17hd6p4200
# tuning_goal: performance

# [autotune_tmc stepper_z1]
# motor: moons-ms17hd6p4200
# tuning_goal: performance

# [autotune_tmc stepper_z2]
# motor: moons-ms17hd6p4200
# tuning_goal: performance

# [autotune_tmc stepper_z3]
# motor: moons-ms17hd6p4200
# tuning_goal: performance

#####################################################################
# 	X/Y Stepper Settings
#####################################################################

## X Stepper on Motor1(B Motor rear left)
[stepper_x]
#	Connected to X-MOT (B Motor)
step_pin: PE11
dir_pin: !PE10
enable_pin: !PE9
endstop_pin: ^PB14
rotation_distance: 40
microsteps: 16
full_steps_per_rotation:400  #set to 400 for 0.9 degree stepper
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 50       #Max 100
second_homing_speed: 25 # Default homing_speed / 2
homing_retract_dist: 5
homing_positive_dir: true

[tmc2240 stepper_x]
uart_pin: PE7
cs_pin: PC13
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7
diag0_pin: ^!PF4 

driver_SGT: 1
run_current: 1.6
stealthchop_threshold: 0

interpolate: true
driver_SLOPE_CONTROL: 1


## Y Stepper on Motor2 (A Motor rear right)
[stepper_y]
#	Connected to Y-MOT (A Motor)
step_pin: PD8
dir_pin: !PB12
enable_pin: !PD9
endstop_pin: ^PB13
microsteps: 32
full_steps_per_rotation:200
rotation_distance: 40
endstop_pin: PF2
position_min: 0.0
position_endstop: 358
position_max: 358
homing_speed: 55	
homing_retract_dist: 15

[tmc2240 stepper_y]
uart_pin: PE15
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7

driver_SGT: 1
run_current: 1.6
stealthchop_threshold: 0

interpolate: true
driver_SLOPE_CONTROL: 1

#####################################################################
# 	Z Stepper Settings
#####################################################################

[stepper_z]
step_pin: PG13
dir_pin: !PG12
enable_pin: !PG15
microsteps: 16
rotation_distance: 40
gear_ratio: 80:16

position_max: 290
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 0
endstop_pin: probe:z_virtual_endstop

[tmc2240 stepper_z]
cs_pin: PG14
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7

stealthchop_threshold: 0
interpolate: true
run_current: 1.1
driver_SLOPE_CONTROL: 2

[stepper_z1]
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11
microsteps: 16
rotation_distance: 40
gear_ratio: 80:16

[tmc2240 stepper_z1]
cs_pin: PB9
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7

stealthchop_threshold: 0
interpolate: true
run_current: 1.1
driver_SLOPE_CONTROL: 2


[stepper_z2]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
microsteps: 16
rotation_distance: 40
gear_ratio: 80:16

[tmc2240 stepper_z2]
cs_pin: PB5
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7

stealthchop_threshold: 0
interpolate: true
run_current: 1.1
driver_SLOPE_CONTROL: 2

[stepper_z3]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
microsteps: 16
rotation_distance: 40
gear_ratio: 80:16

[tmc2240 stepper_z3]
cs_pin: PG10
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7

stealthchop_threshold: 0
interpolate: true
run_current: 1.1
driver_SLOPE_CONTROL: 2