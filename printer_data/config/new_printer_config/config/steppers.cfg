# [autotune_tmc stepper_y]
# motor: ldo-42sth48-2504ah
# tuning_goal: performance
# sgt: 1
# PWM_FREQ_TARGET: 55e3
# extra_hysteresis: 1


# [autotune_tmc stepper_z]
# motor: moons-ms17hd6p4200
# tuning_goal: performance

# [autotune_tmc stepper_z1]
# motor: moons-ms17hd6p4200
# tuning_goal: performance

# [autotune_tmc stepper_z2]
# motor: moons-ms17hd6p4200
# tuning_goal: performance

# [autotune_tmc stepper_z3]
# motor: moons-ms17hd6p4200
# tuning_goal: performance

#####################################################################
# 	X/Y Stepper Settings
#####################################################################

## X Stepper on X-MOT (B Motor rear left)
[stepper_x]
step_pin: PE11
dir_pin: !PE10
enable_pin: !PE9
endstop_pin: ^PB14
rotation_distance: 40
microsteps: 16
full_steps_per_rotation:400  #set to 400 for 0.9 degree stepper
position_min: 0
position_endstop: 300
position_max: 300
homing_speed: 50       #Max 100
second_homing_speed: 25 # Default homing_speed / 2
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PE7
interpolate: true
run_current: 0.875
hold_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0


## Y Stepper on Y-MOT (A Motor rear right)
[stepper_y]
step_pin: PD8
dir_pin: !PB12
enable_pin: !PD9
endstop_pin: ^PB13
rotation_distance: 40
microsteps: 16
full_steps_per_rotation:400  #set to 400 for 0.9 degree stepper
position_min: 0
position_endstop: 305
position_max: 306
homing_speed: 50  #Max 100
second_homing_speed: 25 # Default homing_speed / 2
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PE15
interpolate: true
run_current: 0.875
hold_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# 	Z Stepper Settings
#####################################################################

## In Z-MOT Position
## Z0 Stepper - Front Left
[stepper_z]
step_pin: PD14
dir_pin: !PD13
enable_pin: !PD15
#endstop_pin: ^PA0
rotation_distance: 40
gear_ratio: 6:1
microsteps: 16
##  Z-position of nozzle (in mm) to z-endstop trigger point relative to print surface (Z0)
##  (+) value = endstop above Z0, (-) value = endstop below
##	Increasing position_endstop brings nozzle closer to the bed
##  After you run Z_ENDSTOP_CALIBRATE, position_endstop will be stored at the very end of your config
#position_endstop: 1.4

position_max: 230
position_min: -5
homing_speed: 16 # Max 25
second_homing_speed: 3

[tmc2209 stepper_z]
uart_pin: PD10
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z1]
step_pin: PE6
dir_pin: PC13
enable_pin: !PE5
rotation_distance: 40
gear_ratio: 6:1
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PC14
interpolate: true
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z2]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
microsteps: 16
rotation_distance: 40
gear_ratio: 80:16

[tmc2209 stepper_z2]
cs_pin: PB5
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7

stealthchop_threshold: 0
interpolate: true
run_current: 1.1
driver_SLOPE_CONTROL: 2

[stepper_z3]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
microsteps: 16
rotation_distance: 40
gear_ratio: 80:16

[tmc2209 stepper_z3]
cs_pin: PG10
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
spi_software_miso_pin: PG7

stealthchop_threshold: 0
interpolate: true
run_current: 1.1
driver_SLOPE_CONTROL: 2